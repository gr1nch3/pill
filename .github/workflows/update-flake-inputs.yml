name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

# Pushes made with the default token do not trigger other workflows; this
# job builds and smoke-tests the updated flake itself, which is the check
# that matters for a lockfile-only change.
permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-
          # created more than this number of seconds ago
          purge-created: 0
          # or, last accessed more than this number of seconds ago
          # relative to the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: 0
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      - name: Update flake inputs
        run: nix flake update

      - name: Build the flake
        run: nix build

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_RUNTIME_DIR: /home/runner/runtime
        run: |
          mkdir -p $XDG_RUNTIME_DIR
          chmod 0700 $XDG_RUNTIME_DIR

          # Bare `pill` starts the shell; the CLI then talks to it over IPC.
          result/bin/pill > /tmp/smoke.log 2>&1 &
          pill_pid=$!
          sleep 6
          if kill -0 $pill_pid 2>/dev/null; then
            echo "pill is up"
            if result/bin/pill close; then
              echo "IPC answered"
            else
              echo "IPC failed"
              cat /tmp/smoke.log
              kill $pill_pid 2>/dev/null || true
              exit 1
            fi
            kill $pill_pid 2>/dev/null || true
          else
            set +e
            wait $pill_pid
            code=$?
            set -e
            echo "pill exited on its own (code $code)"
            pgrep -af quickshell || true
            echo "--- smoke.log ---"
            cat /tmp/smoke.log
            exit 1
          fi

      # flake.lock can be untracked on the first run; `git diff` alone would
      # miss that, so check the status instead.
      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain flake.lock)" ]; then
            echo modified=true >> $GITHUB_OUTPUT
          else
            echo modified=false >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.modified == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: flake.lock
          default_author: github_actions
          message: "[CI] chore: update flake"
