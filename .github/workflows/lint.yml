name: Lint QML

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pill-arch-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests
        shell: fish {0}
        run: |
          node shell/utils/Arrange.test.mjs
          node theming/wallust/test-mapping.mjs

      # Starts the real shell offscreen and opens every settings page over
      # IPC; catches runtime QML errors that static lint can't.
      - name: Smoke test (offscreen, every settings page)
        shell: fish {0}
        run: |
          set -lx QT_QPA_PLATFORM offscreen
          set -lx XDG_RUNTIME_DIR /tmp/qs-runtime
          mkdir -p $XDG_RUNTIME_DIR
          chmod 700 $XDG_RUNTIME_DIR

          qs -p shell > /tmp/smoke.log 2>&1 &
          set -l qs_pid $last_pid
          sleep 5

          set -l ipc_fail 0
          for page in profile wifi bluetooth network displays input hyprland shortcuts sound power datetime region defaults theme wallpaper backgrounds typography cursor fastfetch bar behaviour notifications integrations advanced about
              qs ipc --path shell --any-display call pill open settings $page >/dev/null 2>&1
              or set ipc_fail (math $ipc_fail + 1)
              sleep 0.3
          end
          sleep 1
          kill $qs_pid 2>/dev/null

          if test $ipc_fail -ne 0
              echo "smoke: IPC failed for $ipc_fail page(s)"
              exit 1
          end
          if grep -qE 'ERROR|TypeError|ReferenceError|is not a function|Cannot assign' /tmp/smoke.log
              grep -E 'ERROR|TypeError|ReferenceError|is not a function|Cannot assign' /tmp/smoke.log
              exit 1
          end
          echo "smoke: all pages opened, no QML errors"

      - name: Lint QML
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmllint --import disable -I /usr/lib/qt6/qml (string match -vr 'pkg/.*' **.qml) > /tmp/lint.out 2>&1

          # Fatal categories must be clean. The tolerated ones are documented
          # migration noise, counted and printed below:
          #   unqualified                  outer-id / delegate accesses that
          #                                need `pragma ComponentBehavior: Bound`
          #   unused-imports               cosmetic cleanup backlog
          #   signal-handler-parameters, unresolved-type
          #                                Quickshell qmltypes gaps (AuthFlow,
          #                                BluetoothAdapter, QProcess::ExitStatus)
          set -l fatal (grep -cE '\[(syntax|missing-property|property-override)\]' /tmp/lint.out)
          if test "$fatal" != 0
              cat /tmp/lint.out
              echo "lint: $fatal fatal diagnostic(s)"
              exit 1
          end
          echo "lint: no fatal diagnostics"
          grep -oE '\[[a-z-]+\]$' /tmp/lint.out | sort | uniq -c | sort -rn

  # The package depends on upstream quickshell, which is what stock Arch
  # users get; the image above runs the noctalia-qs fork instead. Same smoke
  # test here so API drift on either side fails CI.
  upstream-quickshell:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v6

      - name: Install upstream quickshell
        run: |
          pacman -Syu --noconfirm --needed git quickshell jq qt6-5compat
          qs --version

      - name: Smoke test (offscreen, every settings page)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export XDG_RUNTIME_DIR=/tmp/qs-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          qs -p shell > /tmp/smoke.log 2>&1 &
          qs_pid=$!
          sleep 5

          ipc_fail=0
          for page in profile wifi bluetooth network displays input hyprland shortcuts sound power datetime region defaults theme wallpaper backgrounds typography cursor fastfetch bar behaviour notifications integrations advanced about; do
            qs ipc --path shell --any-display call pill open settings "$page" >/dev/null 2>&1 || ipc_fail=$((ipc_fail + 1))
            sleep 0.3
          done
          sleep 1

          if [ "$ipc_fail" -ne 0 ]; then
            echo "smoke: IPC failed for $ipc_fail page(s)"
            kill -0 "$qs_pid" 2>/dev/null && echo "shell process still alive" || echo "shell process exited"
            echo "--- smoke.log ---"
            cat /tmp/smoke.log
            kill "$qs_pid" 2>/dev/null || true
            exit 1
          fi
          kill "$qs_pid" 2>/dev/null || true
          if grep -qE 'ERROR|TypeError|ReferenceError|is not a function|Cannot assign' /tmp/smoke.log; then
            grep -E 'ERROR|TypeError|ReferenceError|is not a function|Cannot assign' /tmp/smoke.log
            exit 1
          fi
          echo "smoke: all pages opened, no QML errors"
