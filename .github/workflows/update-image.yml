name: Update Docker CI image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The definition lives in .github/ci/Dockerfile so image changes are
      # reviewable like any other change.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/ci/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pill-arch-env:latest

      # Fork PRs only get a read-only GITHUB_TOKEN, which cannot pull a
      # private package; the image holds no secrets (stock Arch + tooling).
      - name: Publish the image publicly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH /user/packages/container/pill-arch-env -f visibility=public
