name: Create release

on:
  push:
    tags:
      - "v*"

jobs:
  # Source tarball: what the AUR package (and local PKGBUILD builds) download.
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/pill-$version"
          mkdir -p "$stage"
          rsync -av \
            --exclude='.*' \
            --exclude='nix' \
            --exclude='flake.lock' \
            --exclude='flake.nix' \
            . "$stage"
          echo "$GITHUB_SHA" > "$stage/REVISION"
          tar -czf "pill-${GITHUB_REF_NAME}.tar.gz" -C "$RUNNER_TEMP" "pill-$version"
          cp "pill-${GITHUB_REF_NAME}.tar.gz" pill-latest.tar.gz

      - name: Share the tarball with the package job
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: pill-latest.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pill-${{ github.ref_name }}.tar.gz
            pill-latest.tar.gz
          generate_release_notes: true

  # Prebuilt package + pacman repo database: lets users add a binary repo and
  # install with plain pacman (no build), alongside the AUR source package.
  package:
    needs: build-and-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: archlinux:base-devel

    steps:
      - name: Install git and a downloader
        run: pacman -Syu --noconfirm --needed git curl

      - uses: actions/checkout@v6

      - name: Check pkgver matches the tag
        run: |
          pkgver=$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)
          if [ "v$pkgver" != "$GITHUB_REF_NAME" ]; then
            echo "PKGBUILD pkgver ($pkgver) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      # The source tarball comes from the release job's artifact instead of
      # the /releases/download URL: makepkg downloads sources anonymously,
      # which fails while the repository is still private.
      - uses: actions/download-artifact@v4
        with:
          name: source-tarball

      - name: Stage the tarball where makepkg expects it
        run: mv pill-latest.tar.gz "pill-${GITHUB_REF_NAME#v}.tar.gz"

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && SRCDEST='$GITHUB_WORKSPACE' makepkg -f --nodeps"

      - name: Add package to a pacman repo database
        run: |
          cd "$GITHUB_WORKSPACE"
          repo-add pill.db.tar.gz ./*.pkg.tar.zst
          cp pill.db.tar.gz pill.db
          cp pill.files.tar.gz pill.files

      - name: Upload package and repo
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pkg.tar.zst
            pill.db
            pill.db.tar.gz
            pill.files
            pill.files.tar.gz
