# Reference matugen config for Bubbles (PRD §4/§6.5).
# Copy to ~/.config/matugen/config.toml — merge, don't clobber, if you have one.

[config]

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/theme-bubbles.conf'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/bubbles.theme'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct.conf'
output_path = '~/.config/qt6ct/colors/bubbles.conf'
